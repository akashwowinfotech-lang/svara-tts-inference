services:
  svara-tts-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: svara-tts-api:latest
    container_name: svara-tts-api

    # GPU configuration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Port mappings
    ports:
      - "127.0.0.1:8080:8080"  # Keep the model behind a TLS reverse proxy

    # Environment variables (override in .env file)
    environment:
      # vLLM Configuration
      - VLLM_MODEL=${VLLM_MODEL:-kenpath/svara-tts-v1}
      - VLLM_GPU_MEMORY_UTILIZATION=${VLLM_GPU_MEMORY_UTILIZATION:-0.9}
      - VLLM_MAX_MODEL_LEN=${VLLM_MAX_MODEL_LEN:-4096}
      - VLLM_TENSOR_PARALLEL_SIZE=${VLLM_TENSOR_PARALLEL_SIZE:-1}
      - VLLM_QUANTIZATION=${VLLM_QUANTIZATION:-}
      - VLLM_ENFORCE_EAGER=${VLLM_ENFORCE_EAGER:-false}
      - VLLM_ATTENTION_BACKEND=${VLLM_ATTENTION_BACKEND:-}
      - VLLM_KV_CACHE_DTYPE=${VLLM_KV_CACHE_DTYPE:-auto}
      - VLLM_DTYPE=${VLLM_DTYPE:-auto}

      # API Configuration
      - API_PORT=${API_PORT:-8080}
      - API_HOST=${API_HOST:-0.0.0.0}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-127.0.0.1,localhost}
      - ADMIN_API_KEY_FILE=/app/.secrets/admin.key
      - ADMIN_LOGIN_FILE=/app/.secrets/admin-login.json
      - ACCESS_DB_PATH=/app/.data/access.sqlite3
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-}
      - MAX_CONCURRENT_SPEECH=${MAX_CONCURRENT_SPEECH:-4}
      - SNAC_DEVICE=${SNAC_DEVICE:-cpu}
      - SNAC_WINDOW_SIZE=${SNAC_WINDOW_SIZE:-28}
      - SNAC_COMPILE=${SNAC_COMPILE:-true}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

      # Hugging Face Token (optional, for gated models)
      - HF_TOKEN=${HF_TOKEN:-}

    # Volume mounts
    volumes:
      # Cache Hugging Face models to avoid re-downloading
      - huggingface_cache:/root/.cache/huggingface
      - access_data:/app/.data
      - access_secrets:/app/.secrets
      # Optional: Mount local code for development
      # - ./tts_engine:/app/tts_engine
      # - ./api:/app/api

    # Restart policy
    restart: "no"

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  huggingface_cache:
    driver: local
  access_data:
    driver: local
  access_secrets:
    driver: local
